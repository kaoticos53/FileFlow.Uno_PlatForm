app-id: com.fileflowstudio.FileFlow
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: fileflow

finish-args:
  # Interfaz gráfica (Uno Platform / Skia Desktop): X11, Wayland e IPC
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Aceleración por GPU (Renderizado Skia / OpenGL / Vulkan)
  - --device=dri

  # Acceso al sistema de archivos para procesamiento de flujos
  - --filesystem=host
  - --filesystem=xdg-documents
  - --filesystem=xdg-download

  # Conectividad de red para nodos de descarga, LLM e integraciones
  - --share=network

  # Notificaciones del sistema
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: fileflow
    buildsystem: simple
    build-commands:
      # Copiar payload autocontenido a /app/lib/fileflow
      - mkdir -p /app/lib/fileflow /app/bin /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/metainfo
      - cp -r payload/* /app/lib/fileflow/
      
      # Creación de lanzador en /app/bin
      - if [ -f /app/lib/fileflow/FileFlow.App ]; then ln -sf /app/lib/fileflow/FileFlow.App /app/bin/fileflow && chmod +x /app/lib/fileflow/FileFlow.App; else ln -sf /app/lib/fileflow/FileFlow.App.Uno /app/bin/fileflow && chmod +x /app/lib/fileflow/FileFlow.App.Uno; fi
      - chmod +x /app/bin/fileflow
      
      # Instalación de metadatos de escritorio, icono y metainfo AppStream
      - install -Dm644 com.fileflowstudio.FileFlow.desktop /app/share/applications/com.fileflowstudio.FileFlow.desktop
      - install -Dm644 FileFlow.png /app/share/icons/hicolor/256x256/apps/com.fileflowstudio.FileFlow.png
      - install -Dm644 com.fileflowstudio.FileFlow.metainfo.xml /app/share/metainfo/com.fileflowstudio.FileFlow.metainfo.xml
    sources:
      - type: dir
        path: payload
        dest: payload
      - type: file
        path: com.fileflowstudio.FileFlow.desktop
      - type: file
        path: FileFlow.png
      - type: file
        path: com.fileflowstudio.FileFlow.metainfo.xml
